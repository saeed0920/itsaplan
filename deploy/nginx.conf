server {
    listen 80;
    listen [::]:80;
    server_name pi.apeto.ir;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pi.apeto.ir;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/pi.apeto.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pi.apeto.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:itsaplan:10m;
    client_max_body_size 100m;

    include /etc/nginx/snippets/itsaplan-access.conf;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 300s;

    location = /api {
        return 308 /api/;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
    }
    location ~ ^/\.well-known/(oauth-authorization-server|oauth-protected-resource|openid-configuration) {
        proxy_pass http://127.0.0.1:3000;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
    }
}
